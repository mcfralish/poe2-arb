[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poe2-arb"
version = "0.7.0"
description = "Decision-support tool that detects currency arbitrage cycles in the Path of Exile 2 player economy (analysis only, never automates trades)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
# PySide6 belongs here, not only in [gui]: 13 of the 30 test modules open with
# `pytest.importorskip("PySide6")`, so installing without it silently skips 313
# of 682 tests — including every one covering window assembly, which is the
# thing a release gate most needs to check. Measured 2026-07-31, after the
# release workflow was found to be testing 54% of the suite.
dev = ["pytest>=8", "PySide6>=6.6"]
gui = ["PySide6>=6.6"]

[project.scripts]
poe2-arb = "poe2arb.cli:main"

[project.gui-scripts]
poe2-arb-gui = "poe2arb.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"poe2arb.gui" = ["*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
