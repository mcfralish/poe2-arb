[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poe2-arb"
version = "0.2.1"
description = "Decision-support tool that detects currency arbitrage cycles in the Path of Exile 2 player economy (analysis only, never automates trades)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.6"]

[project.scripts]
poe2-arb = "poe2arb.cli:main"

[project.gui-scripts]
poe2-arb-gui = "poe2arb.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
