name: Build & Release

# Two ways in, and they differ only at the last step.
#
# **A tag** cuts a public release: tests, exe, release notes from the changelog,
# published to GitHub Releases.
#
# **A manual run** (Actions → this workflow → Run workflow, on any branch) does
# everything except publish, and leaves the exe as a build artifact on the run.
# That exists because this project is verified by playing the game: the hotkey,
# the icon glyphs and the tray all behave differently on Windows, and three
# releases shipped a broken hotkey because the only way to get a testable exe
# was to publish one to users first. A field test should not require a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The GUI tests are most of the suite and they need a display. Offscreen
      # gives them one without an X server; libEGL is what PySide6 dlopens on a
      # bare runner even in offscreen mode.
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      # A skipped test is not a passing test. 13 test modules open with
      # `importorskip("PySide6")`, so a missing GUI dependency turned 313 of 682
      # tests into silent skips and left the job green — exactly the hole the
      # 0.3.0 startup crash shipped through. Asserting the import is enough,
      # because that import is the only thing standing between those tests and
      # running.
      - name: Fail if the GUI dependency is missing
        run: python -c "import PySide6; print('PySide6', PySide6.__version__)"
      # Fails the release before anything is built if the tag has no changelog
      # entry — a shipped build whose notes nobody wrote is what this prevents.
      # Tags only: on a manual run GITHUB_REF_NAME is a branch name, which will
      # never have a changelog section, and a test build needs no release notes.
      - name: Check the changelog covers this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python packaging/changelog_section.py "${GITHUB_REF_NAME}" /dev/null

  build-windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller
      - name: Generate Windows version resource
        run: python packaging/make_version_file.py version_info.txt
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name poe2-arb
          --icon src/poe2arb/gui/divine_orb_icon.ico
          --version-file version_info.txt
          --collect-submodules poe2arb
          --collect-data poe2arb
          packaging/gui_entry.py
      - name: Smoke test exe imports
        run: dist/poe2-arb.exe --smoke-test

      # A manual run stops here: the exe hangs off the workflow run, downloadable
      # by anyone who can see the repo, and nothing is published. Named with the
      # ref so a folder of downloads from successive field tests is still legible.
      - name: Upload the exe as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: poe2-arb-${{ github.ref_name }}-${{ github.sha }}
          path: dist/poe2-arb.exe
          # Test builds are disposable; the tagged ones are the record.
          retention-days: 14

      - name: Build release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: python packaging/changelog_section.py "${env:GITHUB_REF_NAME}" RELEASE_NOTES.md
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/poe2-arb.exe
          body_path: RELEASE_NOTES.md
          # Appended below the hand-written notes, so the commit list is still
          # there for anyone who wants it.
          generate_release_notes: true
