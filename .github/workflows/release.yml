name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  build-windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name poe2-arb
          --collect-submodules poe2arb
          packaging/gui_entry.py
      - name: Smoke test exe imports
        run: dist/poe2-arb.exe --smoke-test
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/poe2-arb.exe
          generate_release_notes: true
